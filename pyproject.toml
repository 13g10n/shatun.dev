[project]
name = "shatun"
version = "0.1.0"
description = "Local Grok Build orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "advanced-alchemy>=1.4.0",
    "agent-client-protocol>=0.12.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "jinja2>=3.1.0",
    "litestar[standard]>=2.24.0",
    "python-socketio>=5.13.0",
    "redis>=6.0.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
shatun = "shatun.app:main"

[tool.uv]
python-preference = "system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shatun"]

[tool.hatch.build.targets.wheel.force-include]
"shatun/prompts/issue.md.j2" = "shatun/prompts/issue.md.j2"
