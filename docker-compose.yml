services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shatun
      POSTGRES_PASSWORD: shatun
      POSTGRES_DB: shatun
    ports:
      - "5432:5432"
    volumes:
      - shatun-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shatun -d shatun"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  shatun-pg:
